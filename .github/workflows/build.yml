name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            short: x64
            test: true
          - platform: Win32
            short: x86
            test: true
          - platform: ARM64
            short: arm64
            test: false   # the x64 runner can't execute ARM64 binaries; build and package only
    env:
      DIST: dist\altWinDirStat-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # upstream's build stamps GIT_COUNT/GIT_COMMIT from history

      - uses: microsoft/setup-msbuild@v2

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "0.2.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Upstream targets the VS2026 toolset (v145); the VS2022 toolset (v143) on this runner builds it too.
      - name: Build (Release|${{ matrix.platform }})
        shell: pwsh
        run: |
          # Tagged releases are production builds (no "Beta" in the title), like upstream's build.cmd does.
          $production = if ("${{ github.ref }}" -like "refs/tags/v*") { 1 } else { 0 }
          msbuild windirstat.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 "/p:ExternalCompilerOptions=/DPRODUCTION=$production"
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Collect binary
        shell: pwsh
        run: |
          $exe = "build\altWinDirStat_${{ matrix.short }}.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem build; throw "$exe not found after build" }
          New-Item -ItemType Directory -Force $env:DIST | Out-Null
          Copy-Item $exe "$env:DIST\altWinDirStat.exe"
          Copy-Item windirstat\res\license.txt "$env:DIST\LICENSE.txt"
          Copy-Item README.md "$env:DIST\README.md"
          $info = (Get-Item "$env:DIST\altWinDirStat.exe").VersionInfo
          Write-Host "Built $($info.ProductName) $($info.ProductVersion) ($([math]::Round((Get-Item "$env:DIST\altWinDirStat.exe").Length/1MB,2)) MB)"
          if ($info.ProductName -ne 'altWinDirStat') { throw "Unexpected product name '$($info.ProductName)'" }

      # Signing: runs only when a certificate is configured as repository secrets; otherwise builds stay unsigned.
      # Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE.
      # Or a .pfx: SIGNING_PFX_BASE64 (base64 of the .pfx) and SIGNING_PFX_PASSWORD.
      - name: Check signing configuration
        id: sign
        shell: pwsh
        env:
          HAS_AZURE: ${{ secrets.SIGNING_ACCOUNT != '' }}
          HAS_PFX: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
        run: |
          $mode = if ($env:HAS_AZURE -eq 'true') { 'azure' } elseif ($env:HAS_PFX -eq 'true') { 'pfx' } else { 'none' }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          if ($mode -eq 'none') { Write-Host "::notice::No signing secrets configured - this build is UNSIGNED (Smart App Control will block it)." }

      - name: Sign exe (Azure Trusted Signing)
        if: steps.sign.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ env.DIST }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign exe (.pfx)
        if: steps.sign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:PFX_PASSWORD "$env:DIST\altWinDirStat.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "$env:DIST\*" -DestinationPath "dist\altWinDirStat-${{ steps.ver.outputs.version }}-${{ matrix.platform }}-portable.zip"

      - name: Smoke test + screenshot
        if: matrix.test
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screenshots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          # Scans run on worker threads with the UI staying responsive; check that throughout.
          function ScanAndWait($target, $label, $timeoutSec) {
            $p = Start-Process -FilePath "$env:DIST\altWinDirStat.exe" -ArgumentList "`"$target`"" -PassThru
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $unresponsive = 0
            while ($sw.Elapsed.TotalSeconds -lt $timeoutSec) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "altWinDirStat exited while scanning $target (code 0x$('{0:X8}' -f $p.ExitCode))" }
              $p.Refresh()
              if ($p.MainWindowHandle -ne 0 -and -not $p.Responding) { $unresponsive++ }
              if ($sw.Elapsed.TotalSeconds -ge 15) { break }
            }
            $p.Refresh()
            Write-Host ("[{0}] target='{1}' window='{2}' unresponsive-samples={3} elapsed={4:N1}s" -f $label, $target, $p.MainWindowTitle, $unresponsive, $sw.Elapsed.TotalSeconds)
            Shot "altWinDirStat-${{ matrix.platform }}-$label"
            if ($p.MainWindowTitle -notlike '*altWinDirStat*') { Stop-Process -Id $p.Id -Force; throw "Window title '$($p.MainWindowTitle)' is not branded altWinDirStat" }
            if ($unresponsive -gt 3) { Stop-Process -Id $p.Id -Force; throw "UI stopped responding while scanning $target" }
            Stop-Process -Id $p.Id -Force
          }
          ScanAndWait "$env:GITHUB_WORKSPACE" "repo" 60
          ScanAndWait "C:\Program Files" "program-files" 60
          if (-not (Test-Path 'HKCU:\Software\altWinDirStat')) { Write-Host "::notice::No settings saved yet under HKCU\Software\altWinDirStat (process was killed before exit)." }
          if (Test-Path 'HKCU:\Software\WinDirStat') { throw "Settings were written under the official WinDirStat key" }

      - name: Upstream test suites (Filtering, Cli, EdgeCases)
        if: matrix.test
        shell: pwsh
        run: |
          # Test-WinDirStat.ps1 requires PowerShell 7.6+; fetch the latest stable pwsh if the runner's is older.
          $pwsh = (Get-Command pwsh).Source
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            $dir = "$env:RUNNER_TEMP\pwsh"
            gh release download --repo PowerShell/PowerShell --pattern 'PowerShell-*-win-x64.zip' --dir $env:RUNNER_TEMP --clobber
            Expand-Archive (Get-ChildItem $env:RUNNER_TEMP -Filter 'PowerShell-*-win-x64.zip' | Select-Object -First 1).FullName $dir -Force
            $pwsh = "$dir\pwsh.exe"
          }
          & $pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          & $pwsh -NoProfile -ExecutionPolicy Bypass -File tests\Test-WinDirStat.ps1 -ExePath "$env:DIST\altWinDirStat.exe" -Only Filtering,Cli,EdgeCases
          if ($LASTEXITCODE -ne 0) { throw "Upstream test suites failed (exit $LASTEXITCODE)" }
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always() && matrix.test
        with:
          name: screenshot-${{ matrix.platform }}
          path: screenshots/*.png
          if-no-files-found: ignore

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DArch=${{ matrix.platform }}" "/DSourceDir=$pwd\$env:DIST" "/O$pwd\dist" installer\altWinDirStat.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Sign installer (Azure Trusted Signing)
        if: steps.sign.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Installer test (silent install + uninstall)
        if: matrix.test
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "*-${{ matrix.platform }}-Setup.exe" | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\awds-install"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/TASKS=contextmenu" -Wait
          if (-not (Test-Path "$dir\altWinDirStat.exe")) { throw "Installer did not place altWinDirStat.exe" }
          if (-not (Test-Path "HKCU:\Software\Classes\Directory\shell\altWinDirStat\command")) { throw "Context menu entry missing" }
          Write-Host "Installed OK to $dir (context menu registered)"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: altWinDirStat-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*Setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Only the installers and portable zips; CI screenshots are uploaded as artifacts, not release assets.
          files: |
            out/*.zip
            out/*Setup.exe
          generate_release_notes: true
